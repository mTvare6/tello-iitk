<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, interactive-widget=resizes-content"
        />
        <meta name="color-scheme" content="dark" />
        <title>Courses</title>
        <link rel="stylesheet" href="/style.css" />
        <script src="/app.js" defer></script>
    </head>

    <body>
        <main id="terminal" tabindex="0" aria-label="Course terminal">
            <canvas id="screen" aria-label="Terminal screen"></canvas>
            <pre id="accessible-screen" class="sr-only" aria-live="polite"></pre>
        </main>

        <footer id="keys" aria-label="Available actions"></footer>

        <textarea
            id="input"
            aria-label="Terminal input"
            autocomplete="off"
            autocapitalize="off"
            autocorrect="off"
            spellcheck="false"
            rows="1"
            tabindex="-1"
        ></textarea>
    </body>
</html>
