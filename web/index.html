<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, interactive-widget=resizes-content"
        />
        <meta name="color-scheme" content="dark" />
        <title>Courses</title>
        <link rel="stylesheet" href="./style.css" />
        <script src="./app.js" defer></script>
        <script
            data-goatcounter="https://epestr.goatcounter.com/count"
            data-goatcounter-settings='{"path":"/hello","title":"Courses","no_events":true}'
            async
            src="https://gc.zgo.at/count.js"
        ></script>
    </head>

    <body>
        <nav id="site" aria-label="Personal website">
            <a href="https://epestr.com/">← epestr.com</a>
        </nav>
        <main id="terminal" tabindex="0" aria-label="Course terminal">
            <div id="screen" aria-hidden="true"></div>
            <pre id="accessible-screen" class="sr-only" aria-live="polite"></pre>
        </main>

        <footer id="keys" aria-label="Available actions"></footer>

        <textarea
            id="input"
            aria-label="Terminal input"
            autocomplete="off"
            autocapitalize="off"
            autocorrect="off"
            spellcheck="false"
            rows="1"
            tabindex="-1"
        ></textarea>
    </body>
</html>
